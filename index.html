<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khu Vực Riêng Tư</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .video-card {
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .video-title {
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
    }
    iframe {
      width: 100%;
      height: 220px;
      border: none;
      display: block;
    }

    /* Màn hình khóa */
    #lockScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .lock-box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      width: 90%;
      max-width: 320px;
    }
    .lock-box input {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    .lock-box button {
      width: 100%;
      padding: 10px;
      background: #0070f3;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .lock-box button:hover {
      background: #005bb5;
    }
    #errorMsg {
      color: #ff4d4f;
      margin-top: 10px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Giao diện màn hình khóa -->
  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔒 Nhập Mật Khẩu</h2>
      <input type="password" id="passwordInput" placeholder="Mật khẩu truy cập...">
      <button onclick="checkPassword()">Mở Khóa</button>
      <div id="errorMsg">Mật khẩu không chính xác!</div>
    </div>
  </div>

  <!-- Nội dung chính -->
  <h1>🎬 Danh Sách Video</h1>
  <div id="videoGrid" class="video-grid"></div>

  <script>
    // 🔑 Đặt mật khẩu của bạn tại đây
    const CORRECT_PASSWORD = "Elijahzx";

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      const error = document.getElementById('errorMsg');

      if (input === CORRECT_PASSWORD) {
        // Ẩn màn hình khóa
        document.getElementById('lockScreen').style.display = 'none';
        // Tải video từ JSON
        loadVideos();
      } else {
        error.style.display = 'block';
      }
    }

    function loadVideos() {
      fetch('./embed.json')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('videoGrid');
          container.innerHTML = '';
          data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
              <div class="video-title">Tập ${index + 1}</div>
              <iframe src="${item.embed}" allowfullscreen></iframe>
            `;
            container.appendChild(card);
          });
        })
        .catch(err => console.error('Lỗi nạp video:', err));
    }
  </script>
</body>
</html>
